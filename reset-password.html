<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>पासवर्ड बदलें - माँ मनोकामना स्मॉल फाइनेंस</title>
<style>
body{font-family:Arial,sans-serif;background:#08265f;margin:0;padding:25px;display:flex;justify-content:center;align-items:center;min-height:90vh}
.box{background:white;padding:28px;border-radius:16px;width:100%;max-width:380px;box-sizing:border-box}
h2{text-align:center;color:#08265f}
p{text-align:center;color:#555}
input,button{width:100%;padding:13px;margin-top:14px;box-sizing:border-box;border-radius:8px}
input{border:1px solid #bbb}
button{background:#e5a900;color:#08265f;border:0;font-weight:bold;cursor:pointer}
#message{font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>माँ मनोकामना स्मॉल फाइनेंस</h2>
<p>अपना नया पासवर्ड बनाएँ</p>
<form id="resetForm">
<input id="password" type="password" minlength="6" placeholder="नया पासवर्ड" required>
<input id="confirm" type="password" minlength="6" placeholder="पासवर्ड दोबारा लिखें" required>
<button type="submit">पासवर्ड बदलें</button>
</form>
<p id="message"></p>
</div>
<script>
const SUPABASE_URL='https://aqxemvguevxvbpeqhoxk.supabase.co';
const SUPABASE_KEY='sb_publishable_S2S1IvJjavrkHXtJmUsumA_w2h5tTj9';
const params=new URLSearchParams(location.hash.substring(1));
const accessToken=params.get('access_token');
const message=document.getElementById('message');

if(!accessToken){
 message.textContent='रिकवरी लिंक सही नहीं है या इसकी अवधि समाप्त हो गई है। नया रिकवरी ईमेल मँगाएँ।';
 document.getElementById('resetForm').style.display='none';
}

document.getElementById('resetForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirm').value;
 if(password!==confirm){message.textContent='दोनों पासवर्ड एक जैसे नहीं हैं।';return;}
 message.textContent='पासवर्ड बदला जा रहा है...';
 try{
  const response=await fetch(SUPABASE_URL+'/auth/v1/user',{
   method:'PUT',
   headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
   body:JSON.stringify({password})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.msg||data.message||data.error_description||'पासवर्ड नहीं बदला जा सका।');
  message.textContent='पासवर्ड सफलतापूर्वक बदल गया। अब ऐप में नए पासवर्ड से लॉगिन करें।';
  document.getElementById('resetForm').style.display='none';
 }catch(err){message.textContent=err.message;}
});
</script>
</body>
</html>
